{% load static %}

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogX</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
  </head>

  <body>

    <header>
      <h1>My Dynamic Blog</h1>

    </header>

    <div class="container">

      <div class="blog-card add-blog">
        <h2>Add New Blog</h2>

        <input type="text" id="title" placeholder="Enter blog title">

        <input type="text" id="image" placeholder="Enter image URL">

        <textarea id="content" placeholder="Enter blog content"></textarea>

        <button class="btn" onclick="addBlog()">Add Blog</button>
      </div>

      <div id="blogContainer"></div>

      <div class="load-btn">
        <button class="btn" onclick="loadMoreBlogs()">
          Load More Blogs
        </button>
      </div>

    </div>

    <footer>
      <p>© 2026 Dynamic Blog Page</p>
    </footer>

    <script src="{% static 'script.js' %}"></script>
  </body>

</html>
